# ============================================
# Rural Tourism Backend - CD Deploy Staging
# ============================================
# Deploy to staging server via SSH
# Triggered after CD Build succeeds on develop branch

name: CD Deploy Staging

on:
  workflow_run:
    workflows: ["CD Build"]
    types: [completed]
    branches: [develop]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: staging
    permissions:
      packages: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Set deployment start time
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Notify Slack - Staging Deployment Starting
        run: |
          set -e

          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          FULL_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          ACTOR='${{ github.actor }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          COMMIT_MSG=$(echo ${{ toJson(github.event.workflow_run.head_commit.message || 'Manual dispatch') }} | sed 's/\\n/\n/g')

          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg msg "$COMMIT_MSG" \
            --arg runurl "$RUN_URL" \
            '{
              text: ":building_construction: Backend staging deployment started",
              blocks: [
                { type: "header", text: { type: "plain_text", text: "🏗️ [Staging] Backend Deployment Started" } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*Repository:*\n" + $repo) },
                    { type: "mrkdwn", text: ("*Branch:*\n" + $branch) },
                    { type: "mrkdwn", text: ("*Commit:*\n" + $sha) },
                    { type: "mrkdwn", text: ("*Actor:*\n" + $actor) }
                  ]
                },
                { type: "section", text: { type: "mrkdwn", text: ("*Message:*\n" + $msg) } },
                { type: "context", elements: [
                    { type: "mrkdwn", text: ("<" + $runurl + "|View workflow run>") }
                  ]
                }
              ]
            }')
          echo "$payload" | curl -s -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL" || echo "Warning: Failed to send Slack notification"
          echo "Sent Slack start notification"

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd ~/st_rural_tourism_staging

            # Login to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Back up the current uploads volume before restarting, in case the
            # volume mount is (or becomes) misconfigured. Best-effort: skip if
            # no backend container is currently running (first-ever deploy).
            BACKUP_DIR=~/st_rural_tourism_staging/uploads-backups
            mkdir -p "$BACKUP_DIR"
            RUNNING_ID=$(docker compose ps -q backend_staging)
            if [ -n "$RUNNING_ID" ]; then
              docker cp "$RUNNING_ID:/app/uploads" "$BACKUP_DIR/uploads-$(date +%Y%m%d-%H%M%S)" \
                || echo "Warning: uploads backup failed (continuing deploy)"
              # Keep only the 5 most recent backups
              ls -1dt "$BACKUP_DIR"/uploads-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            fi

            # Pull develop-tagged backend image
            docker compose pull backend_staging

            # Run database migrations
            echo "Running staging database migrations..."
            docker compose run --rm backend_staging npx sequelize-cli db:migrate

            # Restart backend staging
            docker compose up -d backend_staging

            # Clean up old images
            docker image prune -f

            # Verify health
            sleep 10
            docker compose ps

            # Verify /app/uploads is a real persistent volume mount, not an
            # ephemeral container layer — fail loudly instead of silently
            # losing uploaded files on the next redeploy.
            NEW_ID=$(docker compose ps -q backend_staging)
            MOUNT_TYPE=$(docker inspect "$NEW_ID" --format '{{ range .Mounts }}{{ if eq .Destination "/app/uploads" }}{{ .Type }}{{ end }}{{ end }}')
            if [ "$MOUNT_TYPE" != "volume" ]; then
              echo "ERROR: /app/uploads is not mounted as a persistent Docker volume (found: '${MOUNT_TYPE:-none}'). Uploaded files will be lost on the next redeploy. Fix docker-compose.staging.yml on this server before deploying again."
              exit 1
            fi
            echo "Verified: /app/uploads is mounted as a persistent volume."

            # Show migration status
            echo "Current migration status:"
            docker compose exec -T backend_staging npx sequelize-cli db:migrate:status

      - name: Notify Slack - Staging Deployment Result
        if: always()
        run: |
          set -e
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          FULL_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          ACTOR='${{ github.actor }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          STATUS='${{ job.status }}'
          END_TIME=$(date +%s)
          DURATION=$(( END_TIME - START_TIME ))
          HUMAN_DURATION=$(printf '%02dm:%02ds' $((DURATION/60)) $((DURATION%60)))
          COMMIT_MSG=$(echo ${{ toJson(github.event.workflow_run.head_commit.message || 'Manual dispatch') }} | sed 's/\\n/\n/g')

          if [ "$STATUS" = "success" ]; then
            TITLE="✅ [Staging] Backend Deployment Succeeded"
            RESULT_LINE="*Result:* Success"
            COLOR="#2eb886"
          else
            TITLE="❌ [Staging] Backend Deployment Failed"
            RESULT_LINE="*Result:* Failure"
            COLOR="#e01e5a"
          fi

          payload=$(jq -n \
            --arg color "$COLOR" \
            --arg title "$TITLE" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg msg "$COMMIT_MSG" \
            --arg runurl "$RUN_URL" \
            --arg result "$RESULT_LINE" \
            --arg dur "$HUMAN_DURATION" \
            '{
              text: $title,
              blocks: [
                { type: "header", text: { type: "plain_text", text: $title } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*Repository:*\n" + $repo) },
                    { type: "mrkdwn", text: ("*Branch:*\n" + $branch) },
                    { type: "mrkdwn", text: ("*Commit:*\n" + $sha) },
                    { type: "mrkdwn", text: ("*Actor:*\n" + $actor) },
                    { type: "mrkdwn", text: $result },
                    { type: "mrkdwn", text: ("*Duration:*\n" + $dur) }
                  ]
                },
                { type: "section", text: { type: "mrkdwn", text: ("*Message:*\n" + $msg) } },
                { type: "context", elements: [
                    { type: "mrkdwn", text: ("<" + $runurl + "|View workflow run>") }
                  ]
                }
              ]
            }')
          echo "$payload" | curl -s -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL" || echo "Warning: Failed to send Slack notification"
          echo "Sent Slack result notification ($STATUS)"
